<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sequence Studio</title>
  <meta name="description" content="Mermaid-based visual sequence diagram editor that runs entirely in the browser." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b6cff'/%3E%3Cpath d='M9 7v18M23 7v18' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M9 12h12m-3-3 3 3-3 3M23 20H11m3-3-3 3 3 3' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <script>
    // Tema yanıp sönmesini önlemek için erken uygula
    try {
      var s = JSON.parse(localStorage.getItem('seqstudio.settings') || '{}');
      var t = s.appTheme || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div id="app">
    <!-- ÜST BAR -->
    <header class="topbar">
      <div class="tb-left">
        <a class="brand" href="#/flows">
          <span class="brand-mark"><i data-icon="logo"></i></span>
          <span class="brand-name">Sequence<b>Studio</b></span>
        </a>
        <!-- Etkin çalışma alanı (yerel sürümde tek ve sabit) -->
        <button class="ws-badge" id="btnWorkspace"><i data-icon="workspace"></i><span></span><i data-icon="chevron"></i></button>
        <span class="ro-pill" id="roPill" data-i18n-title="ws.readonlyNote"><i data-icon="lock"></i><span data-i18n="ws.readonly"></span></span>
        <span class="tb-sep"></span>
        <!-- Ana gezinme: ekranlar (yönlendirici "data-nav" değerine göre vurgular) -->
        <nav class="main-nav" id="mainNav">
          <a href="#/flows" data-nav="flows" data-i18n-title="nav.flows"><i data-icon="file"></i><span data-i18n="nav.flows"></span></a>
          <a href="#/catalog" data-nav="catalog" data-i18n-title="nav.catalog"><i data-icon="layers"></i><span data-i18n="nav.catalog"></span></a>
          <a href="#/architecture" data-nav="arch" data-i18n-title="nav.arch"><i data-icon="shapes"></i><span data-i18n="nav.arch"></span></a>
        </nav>
      </div>
      <div class="tb-right">
        <button class="icon-btn" id="btnSearch" data-i18n-title="search.title"><i data-icon="search"></i></button>
        <button class="icon-btn" id="btnHelp" data-i18n-title="tb.help"><i data-icon="help"></i></button>
        <button class="lang-btn" id="btnLang" data-i18n-title="tb.lang"><i data-icon="globe"></i><span id="langLabel">TR</span></button>
        <button class="icon-btn" id="btnTheme"><i data-icon="moon"></i></button>
        <a class="icon-btn" id="btnSettings" href="#/settings" data-nav="settings" data-i18n-title="nav.settings"><i data-icon="settings"></i></a>
      </div>
    </header>

    <!-- AKIŞ ÇUBUĞU (yalnızca düzenleyicide; üst bar tüm ekranlarda aynı kalır):
         solda akış (klasör yolu, ad, kayıt durumu, geçmiş), ortada diyagram başlığı, sağda işlemler -->
    <div class="docbar tb-doc-only" id="docbar">
      <div class="db-left">
        <!-- Akışın klasör yolu (her klasör Akışlar sayfasını o klasörde açar) -->
        <nav class="doc-crumbs" id="docCrumbs" hidden></nav>
        <input id="docName" class="doc-name" spellcheck="false" data-i18n-ph="doc.untitled" data-i18n-title="doc.nameTitle" />
        <span class="save-state" id="saveState" data-i18n-title="tb.savedTitle"><i data-icon="check"></i><span data-i18n="tb.saved"></span></span>
        <button class="icon-btn sm" id="btnHistory" data-i18n-title="hist.btn"><i data-icon="history"></i></button>
        <button class="pill-btn ref" id="btnBacklinks" hidden><i data-icon="link"></i><span></span></button>
      </div>
      <label class="title-row db-title" data-i18n-title="title.barTitle">
        <i data-icon="type"></i>
        <input id="diagramTitle" data-i18n-ph="title.ph" spellcheck="false" />
      </label>
      <div class="db-right">
        <div class="btn-group">
          <button class="icon-btn" id="btnUndo" data-i18n-title="tb.undo"><i data-icon="undo"></i></button>
          <button class="icon-btn" id="btnRedo" data-i18n-title="tb.redo"><i data-icon="redo"></i></button>
        </div>
        <span class="tb-sep edit-only"></span>
        <button class="icon-btn edit-only" id="btnTemplates" data-i18n-title="tb.templates"><i data-icon="layout"></i></button>
        <button class="icon-btn edit-only" id="btnImport" data-i18n-title="tb.import"><i data-icon="upload"></i></button>
        <button class="btn primary" id="btnExport"><i data-icon="download"></i><span data-i18n="tb.export"></span></button>
      </div>
    </div>

    <!-- Sabit palet: katalog ve roller, akış adımları (görsel oluşturucu için) -->
    <div class="palette" id="palette">
      <div class="pal-group pal-roles">
        <div class="pal-title" data-i18n="pal.roles"></div>
        <div class="pal-items" id="palRoles"></div>
      </div>
      <div class="pal-group">
        <div class="pal-title">
          <span data-i18n="pal.flow"></span>
          <span class="pal-side">
            <span class="pal-off-note" data-i18n="pal.codeOff"></span>
            <button class="pal-toggle" id="btnPalToggle"><i data-icon="chevron"></i></button>
          </span>
        </div>
        <div class="pal-items" id="palSteps"></div>
      </div>
    </div>

    <main class="workspace" id="workspace">
      <!-- SOL: EDİTÖR -->
      <section class="pane pane-editor" id="paneEditor">
        <div class="pane-head">
          <button class="icon-btn" id="btnCollapse" data-i18n-title="editor.collapse"><i data-icon="panelClose"></i></button>
          <div class="seg" id="viewSeg" role="tablist">
            <button data-view="builder" class="active" role="tab"><i data-icon="blocks"></i><span data-i18n="view.builder"></span></button>
            <button data-view="code" role="tab"><i data-icon="code"></i><span data-i18n="view.code"></span></button>
          </div>
          <div class="pane-head-right" id="builderMeta">
            <label class="switch" data-i18n-title="opt.autoActTitle">
              <input type="checkbox" id="optAutoAct" /><span class="switch-ui"></span><span data-i18n="opt.autoAct"></span>
            </label>
            <label class="switch" data-i18n-title="opt.autonumberTitle">
              <input type="checkbox" id="optAutonumber" /><span class="switch-ui"></span><span data-i18n="opt.autonumber"></span>
            </label>
          </div>
        </div>

        <div class="notice" id="notice" hidden></div>
        <div class="notice warn" id="syncNotice" hidden></div>

        <!-- GÖRSEL OLUŞTURUCU -->
        <div class="view view-builder active" id="viewBuilder">
          <div class="builder-scroll" id="builderScroll">
            <div class="b-section" id="partSection">
              <div class="b-section-head">
                <h3><span data-i18n="sec.participants"></span> <span class="count" id="partCount">0</span></h3>
                <div class="head-right">
                  <span class="hint"><i data-icon="link"></i><span data-i18n="hint.link"></span></span>
                  <button class="icon-btn pin-btn" id="btnPinParts"><i data-icon="pin"></i></button>
                </div>
              </div>
              <div class="participants" id="participants"></div>
            </div>

            <div class="b-section grow">
              <div class="b-section-head">
                <h3><span data-i18n="sec.flow"></span> <span class="count" id="stepCount">0</span></h3>
                <span class="hint"><i data-icon="grip"></i><span data-i18n="hint.flow"></span></span>
              </div>
              <div class="flow" id="flow"></div>
            </div>
          </div>
        </div>

        <!-- KOD EDİTÖRÜ -->
        <div class="view view-code" id="viewCode">
          <div class="code-wrap">
            <div class="gutter" id="gutter"></div>
            <div class="code-area">
              <pre class="code-hl" id="codeHl" aria-hidden="true"></pre>
              <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
            </div>
          </div>
          <div class="code-status" id="codeStatus"></div>
        </div>
      </section>

      <div class="resizer" id="resizer" data-i18n-title="resizer"></div>

      <!-- SAĞ: ÖNİZLEME -->
      <section class="pane pane-preview" id="panePreview">
        <div class="pane-head">
          <div class="ph-left">
            <button class="icon-btn" id="btnExpand" data-i18n-title="editor.expand"><i data-icon="panelOpen"></i></button>
            <div class="ph-title"><i data-icon="eye"></i><span data-i18n="preview"></span></div>
            <button class="pill-btn" id="lintBadge" hidden><i data-icon="critical"></i><span></span></button>
          </div>
          <div class="pane-head-right">
            <select id="mmTheme" class="select sm" data-i18n-title="mm.theme">
              <option value="auto" data-i18n="mm.auto"></option>
              <option value="studio-light" data-i18n="mm.studioLight"></option>
              <option value="studio-dark" data-i18n="mm.studioDark"></option>
              <option value="default">Mermaid Default</option>
              <option value="neutral">Neutral</option>
              <option value="forest">Forest</option>
              <option value="dark">Dark</option>
            </select>
            <label class="switch" data-i18n-title="opt.legendTitle">
              <input type="checkbox" id="optLegend" /><span class="switch-ui"></span><span data-i18n="opt.legend"></span>
            </label>
            <label class="switch" data-i18n-title="opt.mirrorTitle">
              <input type="checkbox" id="optMirror" /><span class="switch-ui"></span><span data-i18n="opt.mirror"></span>
            </label>
            <span class="ph-sep"></span>
            <button class="icon-btn" id="btnPresent" data-i18n-title="pres.open"><i data-icon="present"></i></button>
            <button class="icon-btn" id="btnFullscreen" data-i18n-title="fs.enter"><i data-icon="maximize"></i></button>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <button class="nav-back" id="navBack" hidden><i data-icon="undo"></i><span></span></button>
          <div class="canvas" id="canvas"></div>
          <div class="empty-state" id="emptyState" hidden>
            <i data-icon="logo"></i>
            <p data-i18n="empty.preview"></p>
          </div>
          <div class="render-error" id="renderError" hidden></div>
          <div class="zoombar">
            <button class="icon-btn sm" id="zoomOut" data-i18n-title="zoom.out"><i data-icon="minus"></i></button>
            <button class="zoom-val" id="zoomVal" data-i18n-title="zoom.reset">100%</button>
            <button class="icon-btn sm" id="zoomIn" data-i18n-title="zoom.in"><i data-icon="plus"></i></button>
            <span class="zb-sep"></span>
            <button class="icon-btn sm" id="zoomFit" data-i18n-title="zoom.fit"><i data-icon="fit"></i></button>
          </div>
        </div>
      </section>
    </main>

    <!-- SAYFALAR: akış kütüphanesi, katalog, ayarlar (içerikleri modüllerince çizilir) -->
    <section class="page-screen" id="flowsScreen" hidden></section>
    <section class="page-screen" id="catalogScreen" hidden></section>
    <section class="page-screen" id="settingsScreen" hidden></section>

    <!-- MİMARİ (C4): katalog hiyerarşisi + diyagramlardan türetilen ilişkiler -->
    <section class="arch-screen" id="archScreen" hidden>
      <div class="arch-head">
        <nav class="arch-crumbs" id="archCrumbs"></nav>
        <span class="arch-info" id="archInfo"></span>
        <div class="arch-actions" id="archExport">
          <a class="btn ghost sm" id="archEditCatalog" href="#/catalog"><i data-icon="edit"></i><span data-i18n="cat.manage"></span></a>
          <span class="ph-sep"></span>
          <button class="btn ghost sm" data-fmt="svg"><i data-icon="vector"></i>SVG</button>
          <button class="btn ghost sm" data-fmt="png"><i data-icon="image"></i>PNG</button>
          <button class="btn ghost sm" data-fmt="drawio"><i data-icon="drawio"></i>draw.io</button>
          <button class="btn ghost sm" data-fmt="mmd"><i data-icon="code"></i>Mermaid</button>
        </div>
      </div>
      <div class="arch-canvas" id="archCanvas"></div>
      <div class="zoombar arch-zoombar" id="archZoom">
        <button class="icon-btn sm" id="archZoomOut" data-i18n-title="zoom.out"><i data-icon="minus"></i></button>
        <button class="zoom-val" id="archZoomVal" data-i18n-title="zoom.reset">100%</button>
        <button class="icon-btn sm" id="archZoomIn" data-i18n-title="zoom.in"><i data-icon="plus"></i></button>
        <span class="zb-sep"></span>
        <button class="icon-btn sm" id="archZoomFit" data-i18n-title="zoom.fit"><i data-icon="fit"></i></button>
      </div>
    </section>
  </div>

  <!-- Modal -->
  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-close><i data-icon="x"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Popover -->
  <div class="popover" id="popover" hidden></div>
  <svg class="link-overlay" id="linkOverlay"><path id="linkPath" /></svg>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="fileInput" accept=".mmd,.mermaid,.txt,.md" hidden />

  <script src="vendor/mermaid/mermaid.min.js"></script>
  <!-- Saf mantık ve altyapı (uygulama durumuna bağımlı değil) -->
  <script src="assets/js/core/i18n.js"></script>
  <script src="assets/js/lib/model.js"></script>
  <script src="assets/js/lib/lint.js"></script>
  <script src="assets/js/lib/c4.js"></script>
  <script src="assets/js/lib/drawio.js"></script>
  <script src="assets/js/lib/zip.js"></script>
  <script src="assets/js/data/templates.js"></script>
  <script src="assets/js/core/icons.js"></script>
  <script src="assets/js/lib/changeset.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <!-- Çekirdek: paylaşılan durum ve DOM yardımcıları -->
  <script src="assets/js/core/core.js"></script>
  <script src="assets/js/core/user.js"></script>
  <script src="assets/js/core/repo.js"></script>
  <script src="assets/js/core/router.js"></script>
  <script src="assets/js/features/workspace.js"></script>
  <!-- Özellik modülleri (yüklenirken birbirine dokunmazlar; main.js hepsini başlatır) -->
  <script src="assets/js/features/theme.js"></script>
  <script src="assets/js/features/editor.js"></script>
  <script src="assets/js/features/docs.js"></script>
  <script src="assets/js/features/folders.js"></script>
  <script src="assets/js/features/breadcrumb.js"></script>
  <script src="assets/js/features/preview.js"></script>
  <script src="assets/js/features/colors.js"></script>
  <script src="assets/js/features/legend.js"></script>
  <script src="assets/js/features/refs.js"></script>
  <script src="assets/js/features/reconcile.js"></script>
  <script src="assets/js/features/sync.js"></script>
  <script src="assets/js/features/lint.js"></script>
  <script src="assets/js/features/backlinks.js"></script>
  <script src="assets/js/features/architecture.js"></script>
  <script src="assets/js/features/present.js"></script>
  <script src="assets/js/features/flows-page.js"></script>
  <script src="assets/js/features/catalog-page.js"></script>
  <script src="assets/js/features/settings-page.js"></script>
  <script src="assets/js/features/code-editor.js"></script>
  <script src="assets/js/features/layout.js"></script>
  <script src="assets/js/features/palette.js"></script>
  <script src="assets/js/features/participants.js"></script>
  <script src="assets/js/features/participant-picker.js"></script>
  <script src="assets/js/features/roles.js"></script>
  <script src="assets/js/features/catalog.js"></script>
  <script src="assets/js/features/defs-notice.js"></script>
  <script src="assets/js/features/steps.js"></script>
  <script src="assets/js/features/flow.js"></script>
  <script src="assets/js/features/share.js"></script>
  <script src="assets/js/features/export.js"></script>
  <script src="assets/js/features/folder-export.js"></script>
  <script src="assets/js/features/backup.js"></script>
  <script src="assets/js/features/versions.js"></script>
  <script src="assets/js/features/search.js"></script>
  <script src="assets/js/features/help.js"></script>
  <script src="assets/js/features/shortcuts.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
